name: Watch App Store prices

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appstore-watchlist
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate watcher
        run: python -m unittest discover -s tests -v
      - name: Check prices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python watch.py
      - name: Save state
        if: always()
        shell: bash
        run: |
          if [ ! -f data/state.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update price tracking state'
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
